# Adapted from livingproof-sim-mujoco and collaboration-guidelines templates/container/Taskfile.yml.
version: '3'
vars:
  # renovate: guidelines
  GUIDELINES_VERSION: 'v7.7.0'
tasks:
  default:
    desc: Show available commands
    cmds: [task --list]
  setup:
    desc: Build the development image and install locked dependencies
    cmds: [bash tools/run-task.sh setup]
  check:
    desc: Check formatting, lint, world docs and manifests in the development environment
    cmds: [bash tools/run-task.sh check]
  render:
    desc: Regenerate every world SVG, README and release.json from world.json
    cmds: [bash tools/run-task.sh render]
  test:
    desc: Validate every world against the schema and its specification
    cmds: [bash tools/run-task.sh test]
  verify:
    desc: Check and test in the development environment
    cmds: [bash tools/run-task.sh verify]
