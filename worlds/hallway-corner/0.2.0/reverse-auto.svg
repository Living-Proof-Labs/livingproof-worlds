<title id="hallway-corner-0-2-0-title">Corner hallway — reverse traversal, hallway-corner 0.2.0: top-down diagram</title>
<desc id="hallway-corner-0-2-0-desc">Top-down diagram of hallway-corner 0.2.0: 2 hallways 1.50 m clear between 0.15 m walls, along a 6.00 m route route-reverse through (0.00, 3.00), (0.00, 0.00), (-3.00, 0.00). Entrance (IN) at (0.00, 3.00), end-west (OUT) at (-3.00, 0.00). Region corner from x = -0.75 to 0.75 m, y = -0.75 to 0.75 m. Spawns: spawn-west at (-2.50, 0.00) yaw 0°; spawn-north at (0.00, 2.50) yaw -90°.</desc>
