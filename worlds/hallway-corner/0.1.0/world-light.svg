<title id="hallway-corner-0-1-0-title">Corner hallway, hallway-corner 0.1.0: top-down diagram</title>
<desc id="hallway-corner-0-1-0-desc">Top-down diagram of hallway-corner 0.1.0: 2 hallways 1.50 m clear between 0.15 m walls, along a 6.00 m route route-centreline through (-3.00, 0.00), (0.00, 0.00), (0.00, 3.00). Entrance (IN) at (-3.00, 0.00), exit (OUT) at (0.00, 3.00). Region corner from x = -0.75 to 0.75 m, y = -0.75 to 0.75 m. Spawns: spawn-entrance at (-2.50, 0.00) yaw 0°.</desc>
<style>:root{--bg:#ffffff;--text:#0f172a;--muted:#475569;--wall:#475569;--floor:#f1f5f9;--dim:#475569;--teal:#0f766e;--amber:#b45309;--spawn:#1d4ed8}text{font-family:'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:var(--text);font-size:12px}.title{font-family:'Instrument Serif', Georgia, 'Times New Roman', serif;font-size:18px}.muted{fill:var(--muted)}.dimtext{font-size:13px;fill:var(--muted)}.wall{fill:var(--wall)}.floor{fill:var(--floor)}.passage{fill:var(--teal);fill-opacity:.10;stroke:var(--teal);stroke-dasharray:6 4}.centre{stroke:var(--teal);stroke-width:1.5;stroke-dasharray:2 4;fill:none}.entrance{fill:var(--teal)}.exit{stroke:var(--amber);stroke-width:6;stroke-dasharray:10 6}.tag-in{fill:var(--teal);font-weight:700}.tag-out{fill:var(--amber);font-weight:700}.spawn{fill:var(--spawn)}.yaw{fill:var(--spawn);stroke:var(--bg);stroke-width:3;paint-order:stroke;stroke-linejoin:round}.leader{stroke:var(--muted);stroke-width:1;fill:none}.dim{stroke:var(--dim);stroke-width:1;fill:none}.axis{stroke:var(--text);stroke-width:1.5;fill:none}.axishead{fill:var(--text)}</style>
