# SPDX-License-Identifier: Apache-2.0
name: Worlds verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag (vX.Y.Z) for exact-current-main delivery retry
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - name: Match checkout ownership
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: task setup
      - run: task verify
      - name: Publish individual tests in job summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: World tests
          path: artifacts/*.xml
          reporter: python-xunit
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worlds-evidence
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
  version:
    permissions:
      contents: read
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release-candidate.yml@v9.9.11
    with:
      replay-tag: ${{ inputs.release_tag || '' }}
  manual:
    needs: version
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.ref == 'refs/heads/main' &&
       (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    permissions:
      contents: read
    uses: ./.github/workflows/manual.yml
    with:
      version: ${{ needs.version.outputs.semver-version }}
      commit: ${{ needs.version.outputs.commit }}
      plan-run: ${{ needs.version.outputs.run-id }}
      plan-attempt: ${{ needs.version.outputs.run-attempt }}
  release:
    needs: [verify, version, manual]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.version.outputs.git-tag != '' &&
      needs.version.outputs.version == needs.manual.outputs.artifact-version &&
      needs.manual.outputs.artifact-commit == github.sha &&
      needs.manual.outputs.artifact-run-id == github.run_id &&
      needs.manual.outputs.artifact-attempt == github.run_attempt &&
      needs.manual.outputs.artifact-digest != ''
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v9.9.11
    with:
      expected-version: ${{ needs.manual.outputs.artifact-version }}
      expected-commit: ${{ needs.manual.outputs.artifact-commit }}
  deploy:
    needs: [version, manual, release]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.version.result == 'success' && needs.manual.result == 'success' &&
      needs.manual.outputs.artifact-commit == github.sha &&
      needs.manual.outputs.artifact-run-id == github.run_id &&
      needs.manual.outputs.artifact-attempt == github.run_attempt &&
      needs.manual.outputs.artifact-digest != '' &&
      ((github.event_name == 'push' && needs.release.result == 'success' &&
        needs.release.outputs.published == 'true' &&
        needs.release.outputs.version == needs.manual.outputs.artifact-version &&
        needs.release.outputs.commit == needs.manual.outputs.artifact-commit) ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' &&
        needs.release.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: worlds-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CANDIDATE: ${{ needs.manual.outputs.artifact-commit }}
      VERSION: ${{ needs.manual.outputs.artifact-version }}
      DIGEST: ${{ needs.manual.outputs.artifact-digest }}
      RELEASE_TAG: ${{ needs.release.outputs.git-tag || inputs.release_tag }}
    steps:
      - name: Require current main inside deployment lock
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.manual.outputs.artifact-commit }}
        run: |
          current=$(gh api repos/Living-Proof-Labs/livingproof-worlds/git/ref/heads/main --jq .object.sha)
          test "$current" = "$CANDIDATE"
      - name: Independently require the published stable release at the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$VERSION"
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE" = "$GITHUB_SHA"
          export GIT_TERMINAL_PROMPT=0
          ref="refs/tags/$RELEASE_TAG"
          tags=$(timeout 30s git -c credential.helper= ls-remote --exit-code \
            https://github.com/Living-Proof-Labs/livingproof-worlds.git "$ref" "$ref^{}")
          mapfile -t refs <<< "$tags"
          if [[ ${#refs[@]} == 2 ]]; then
            [[ "${refs[0]%$'\t'*}" =~ ^[0-9a-f]{40}$ ]]
            test "${refs[0]#*$'\t'}" = "$ref"
            test "${refs[1]}" = "$CANDIDATE"$'\t'"$ref^{}"
          else
            test "${#refs[@]}" = 1
            test "${refs[0]}" = "$CANDIDATE"$'\t'"$ref"
          fi
          gh api "repos/Living-Proof-Labs/livingproof-worlds/releases/tags/$RELEASE_TAG" | \
            jq -e --arg tag "$RELEASE_TAG" '
              .tag_name == $tag and .draft == false and .prerelease == false and
              (.published_at | type == "string" and length > 0)
            ' >/dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repository-manual-${{ needs.manual.outputs.artifact-version }}-${{ needs.manual.outputs.artifact-commit }}-${{ github.run_attempt }}
          path: verified-manual
      - name: Verify transport and package only the sealed HTML
        id: pages-package
        shell: bash
        run: |
          set -euo pipefail
          cd verified-manual/html
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum ../site.sha256 | cut -d' ' -f1)" = "$DIGEST"
          test -f index.html
          test -z "$(find . ! -type f ! -type d -print -quit)"
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/manual.sha256"
          cmp ../site.sha256 "$RUNNER_TEMP/manual.sha256"
          jq -e --arg commit "$CANDIDATE" --arg version "$VERSION" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '
              .source_commit == $commit and .version == $version and .source_dirty == false and
              .run_id == $run and .run_attempt == $attempt
            ' build.json >/dev/null
          tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" .
          digest=$(sha256sum "$RUNNER_TEMP/artifact.tar")
          echo "tar-sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: pages-artifact
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      # Use the same-run Actions artifact client (like deploy-pages), not the REST index.
      # An exact ID and name must both resolve to the sealed Pages tar before deploying.
      - name: Require a valid Pages artifact ID
        shell: bash
        env:
          UPLOADED_ID: ${{ steps.pages-artifact.outputs.artifact-id }}
        run: |
          [[ "$UPLOADED_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Read exact Pages artifact by ID
        id: pages-id-first
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.pages-artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/worlds-pages-id-first
      - name: Allow the ID lookup to settle
        if: steps.pages-id-first.outcome == 'failure'
        run: sleep 4
      - name: Retry read by ID once
        id: pages-id-retry
        if: steps.pages-id-first.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.pages-artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/worlds-pages-id-retry
      - name: Read exact Pages artifact by name
        id: pages-name-first
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worlds-pages-name-first
      - name: Allow the name lookup to settle
        if: steps.pages-name-first.outcome == 'failure'
        run: sleep 4
      - name: Retry read by name once
        id: pages-name-retry
        if: steps.pages-name-first.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worlds-pages-name-retry
      - name: Require matching ID and name readback of the exact tar
        shell: bash
        env:
          EXPECTED_TAR: ${{ steps.pages-package.outputs.tar-sha256 }}
          EXPECTED_NAME: github-pages-${{ github.run_attempt }}
          ID_READBACK: ${{ steps.pages-id-first.outcome == 'success' && steps.pages-id-first.outputs.download-path || steps.pages-id-retry.outputs.download-path }}
          NAME_READBACK: ${{ steps.pages-name-first.outcome == 'success' && steps.pages-name-first.outputs.download-path || steps.pages-name-retry.outputs.download-path }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TAR" =~ ^[0-9a-f]{64}$ ]]
          test -n "$ID_READBACK"
          test -n "$NAME_READBACK"
          for path in "$ID_READBACK/$EXPECTED_NAME" "$NAME_READBACK"; do
            test -f "$path/artifact.tar"
            digest=$(sha256sum "$path/artifact.tar")
            test "${digest%% *}" = "$EXPECTED_TAR"
          done
      - name: Deploy verified manual
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
