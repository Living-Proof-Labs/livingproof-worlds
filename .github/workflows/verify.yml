# SPDX-License-Identifier: Apache-2.0
name: Worlds verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - name: Match checkout ownership
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: task setup
      - run: task verify
      - name: Publish individual tests in job summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: World tests
          path: artifacts/*.xml
          reporter: python-xunit
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worlds-evidence
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
  version:
    permissions:
      contents: read
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release-candidate.yml@v9.9.1
    with:
      replay-tag: ''
  release:
    needs: [verify, version]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.version.outputs.git-tag != '' &&
      needs.version.outputs.version == needs.version.outputs.semver-version &&
      needs.version.outputs.commit == github.sha
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v9.9.1
    with:
      expected-version: ${{ needs.version.outputs.semver-version }}
      expected-commit: ${{ needs.version.outputs.commit }}
  deploy-manual:
    needs: [release, version]
    if: >-
      needs.release.result == 'success' &&
      needs.release.outputs.published == 'true' &&
      needs.release.outputs.commit == needs.version.outputs.commit
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/manual.yml
    with:
      release_tag: ${{ needs.release.outputs.git-tag }}
      release_version: ${{ needs.release.outputs.version }}
