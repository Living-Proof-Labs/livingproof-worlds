# SPDX-License-Identifier: Apache-2.0
name: Repository manual
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      # Use the existing Docker Compose development image until a published tooling image is adopted.
      - name: Match checkout ownership
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: task setup
      - run: task manual:verify
      - name: Publish individual manual checks
        id: tests
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: Repository manual checks
          path: artifacts/manual/tests.xml
          reporter: java-junit
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - name: Retain manual and diagnostics
        id: artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-manual
          path: artifacts/manual/
          retention-days: 14
          if-no-files-found: error
      - name: Verify complete test publication
        if: ${{ !cancelled() }}
        env:
          PASSED: ${{ steps.tests.outputs.passed }}
          FAILED: ${{ steps.tests.outputs.failed }}
          SKIPPED: ${{ steps.tests.outputs.skipped }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          for count in "$PASSED" "$FAILED" "$SKIPPED"; do [[ $count =~ ^[0-9]+$ ]]; done
          emitted=$(grep -o '<testcase[[:space:]>]' artifacts/manual/tests.xml | wc -l)
          ingested=$((PASSED + FAILED + SKIPPED))
          echo "Individual cases: $ingested ingested / $emitted emitted" >> "$GITHUB_STEP_SUMMARY"
          echo "Manual and diagnostics (14 days): $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          test "$emitted" -gt 0
          test "$emitted" -eq "$ingested"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: artifacts/manual/html
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: worlds-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require current main inside deployment lock
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.sha }}
        run: |
          current=$(gh api repos/Living-Proof-Labs/livingproof-worlds/git/ref/heads/main --jq .object.sha)
          test "$current" = "$CANDIDATE"
      - name: Deploy verified manual
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
