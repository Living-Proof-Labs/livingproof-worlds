# SPDX-License-Identifier: Apache-2.0
name: Repository manual
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      commit:
        required: true
        type: string
      plan-run:
        required: true
        type: string
      plan-attempt:
        required: true
        type: string
    outputs:
      artifact-version:
        value: ${{ jobs.build.outputs.artifact-version }}
      artifact-commit:
        value: ${{ jobs.build.outputs.artifact-commit }}
      artifact-run-id:
        value: ${{ jobs.build.outputs.artifact-run-id }}
      artifact-attempt:
        value: ${{ jobs.build.outputs.artifact-attempt }}
      artifact-digest:
        value: ${{ jobs.build.outputs.artifact-digest }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact-version: ${{ steps.seal.outputs.version }}
      artifact-commit: ${{ steps.seal.outputs.commit }}
      artifact-run-id: ${{ steps.seal.outputs.run-id }}
      artifact-attempt: ${{ steps.seal.outputs.attempt }}
      artifact-digest: ${{ steps.seal.outputs.digest }}
    env:
      SOURCE_COMMIT: ${{ inputs.commit }}
      MANUAL_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact shared version plan for this attempt
        env:
          PLAN_RUN: ${{ inputs.plan-run }}
          PLAN_ATTEMPT: ${{ inputs.plan-attempt }}
          EVENT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -n "$MANUAL_VERSION"
          test -n "$SOURCE_COMMIT"
          test "$SOURCE_COMMIT" = "$EVENT_COMMIT"
          test "$SOURCE_COMMIT" = "$(git rev-parse HEAD)"
          test "$PLAN_RUN" = "$GITHUB_RUN_ID"
          test "$PLAN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      # Use the existing Docker Compose development image until a published tooling image is adopted.
      - name: Match checkout ownership
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: task setup
      - run: task manual:verify
      - name: Seal the verified manual bytes for this attempt
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/manual/html
          jq -e --arg commit "$SOURCE_COMMIT" --arg version "$MANUAL_VERSION" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '
              .source_commit == $commit and .version == $version and .source_dirty == false and
              .run_id == $run and .run_attempt == $attempt
            ' build.json >/dev/null
          test -f index.html
          test -z "$(find . ! -type f ! -type d -print -quit)"
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > ../site.sha256
          {
            echo "version=$MANUAL_VERSION"
            echo "commit=$SOURCE_COMMIT"
            echo "run-id=$GITHUB_RUN_ID"
            echo "attempt=$GITHUB_RUN_ATTEMPT"
            echo "digest=$(sha256sum ../site.sha256 | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - name: Publish individual manual checks
        id: tests
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: Repository manual checks
          path: artifacts/manual/tests.xml
          reporter: java-junit
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - name: Retain manual and diagnostics
        id: artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-manual-${{ inputs.version }}-${{ inputs.commit }}-${{ github.run_attempt }}
          path: artifacts/manual/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Verify complete test publication
        if: ${{ !cancelled() }}
        env:
          PASSED: ${{ steps.tests.outputs.passed }}
          FAILED: ${{ steps.tests.outputs.failed }}
          SKIPPED: ${{ steps.tests.outputs.skipped }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          for count in "$PASSED" "$FAILED" "$SKIPPED"; do [[ $count =~ ^[0-9]+$ ]]; done
          emitted=$(grep -o '<testcase[[:space:]>]' artifacts/manual/tests.xml | wc -l)
          ingested=$((PASSED + FAILED + SKIPPED))
          echo "Individual cases: $ingested ingested / $emitted emitted" >> "$GITHUB_STEP_SUMMARY"
          echo "Manual and diagnostics (14 days): $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          test "$emitted" -gt 0
          test "$emitted" -eq "$ingested"
