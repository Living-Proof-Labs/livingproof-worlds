# Adapted from collaboration-guidelines templates/python/Taskfile.yml.
version: '3'
env:
  UV_PYTHON_DOWNLOADS: never
tasks:
  default:
    desc: Show prepared-environment commands
    cmds: [task -t Taskfile.runtime.yml --list]
  setup:
    desc: Install locked project dependencies
    cmds: [uv sync --locked]
  check:
    desc: Check formatting, lint, generated world docs and manifest coverage
    cmds:
      - uv run --locked --no-sync ruff check .
      - uv run --locked --no-sync ruff format --check .
      - task: check:docs
      - task: check:manifest
  check:docs:
    desc: Fail if a world README or SVG is missing, lacks a section or is stale
    cmds:
      - uv run --locked --no-sync python tools/render.py --check
  check:manifest:
    desc: Fail if release.json checksums do not cover every world file
    cmds:
      - uv run --locked --no-sync python tools/validate.py
  render:
    desc: Regenerate every world SVG, README and release.json from world.json
    cmds:
      - uv run --locked --no-sync python tools/render.py
  test:
    desc: Validate worlds and run schema tests with JUnit results
    cmds:
      - mkdir -p artifacts
      - uv run --locked --no-sync python tools/validate.py
      - uv run --locked --no-sync pytest --junitxml=artifacts/tests.xml
  verify:
    desc: Check and test
    cmds:
      - task: check
      - task: test
  manual:build:
    desc: Generate the repository manual from canonical sources
    cmds:
      - uv run --locked --no-sync python tools/manual/build.py
  manual:verify:
    desc: Build the manual and check links, branding and source identity
    cmds:
      - task: manual:build
      - uv run --locked --no-sync pytest tests/test_manual.py --junitxml=artifacts/manual/tests.xml
