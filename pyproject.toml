[project]
name = "livingproof-worlds"
version = "0.0.0"
description = "Versioned, engine-neutral robot test worlds"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema==4.25.1",
    "pytest==8.4.2",
    "ruff==0.17.4",
    "zensical==0.0.73",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"

[tool.ruff]
line-length = 100
